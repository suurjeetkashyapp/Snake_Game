<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Neon Snake</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top, #182033 0%, #080b12 45%, #030509 100%);

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }

        /* =========================
       GAME CONTAINER
    ========================= */

        .game-container {
            width: min(94vw, 650px);
            text-align: center;
        }

        .title {
            font-size: clamp(30px, 7vw, 48px);
            font-weight: 800;
            letter-spacing: 4px;

            color: #5cff9d;

            text-shadow:
                0 0 10px rgba(92, 255, 157, 0.8),
                0 0 30px rgba(92, 255, 157, 0.35);

            margin-bottom: 18px;
        }

        /* =========================
       SCORE BOARD
    ========================= */

        .score-board {
            display: flex;
            justify-content: space-between;
            gap: 12px;

            margin-bottom: 15px;
        }

        .score-box {
            flex: 1;

            padding: 12px 15px;

            background: rgba(15, 22, 34, 0.85);

            border: 1px solid rgba(92, 255, 157, 0.25);

            border-radius: 14px;

            box-shadow:
                inset 0 0 20px rgba(92, 255, 157, 0.03),
                0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .score-label {
            display: block;

            font-size: 11px;
            letter-spacing: 2px;
            color: #7d8799;

            margin-bottom: 4px;
        }

        .score-value {
            font-size: 27px;
            font-weight: bold;
            color: #ffffff;
        }

        /* =========================
       CANVAS
    ========================= */

        .board-wrapper {
            position: relative;

            width: 100%;

            padding: 8px;

            border-radius: 20px;

            background: linear-gradient(145deg,
                    rgba(92, 255, 157, 0.35),
                    rgba(30, 40, 60, 0.5));

            box-shadow:
                0 0 35px rgba(92, 255, 157, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;

            width: 100%;
            aspect-ratio: 1 / 1;

            background: #080d14;

            border-radius: 14px;

            touch-action: none;
        }

        /* =========================
       BUTTON
    ========================= */

        .controls {
            display: flex;
            justify-content: center;

            margin-top: 18px;
        }

        button {
            border: none;

            padding: 13px 32px;

            border-radius: 12px;

            background: #5cff9d;
            color: #04100a;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(92, 255, 157, 0.25);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 30px rgba(92, 255, 157, 0.45);
        }

        button:active {
            transform: scale(0.96);
        }

        /* =========================
       HELP TEXT
    ========================= */

        .instructions {
            margin-top: 13px;

            color: #778296;

            font-size: 13px;
        }

        .instructions span {
            color: #aab4c5;
        }

        /* =========================
       GAME OVER
    ========================= */

        .game-over {
            position: absolute;

            inset: 8px;

            display: none;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            border-radius: 14px;

            background: rgba(3, 6, 10, 0.82);

            backdrop-filter: blur(8px);
        }

        .game-over.show {
            display: flex;

            animation: fadeIn 0.3s ease;
        }

        .game-over h2 {
            font-size: clamp(32px, 8vw, 50px);

            color: #ff4d6d;

            text-shadow:
                0 0 15px rgba(255, 77, 109, 0.7);

            margin-bottom: 10px;
        }

        .final-score {
            color: #aeb8c9;

            margin-bottom: 20px;

            font-size: 16px;
        }

        .final-score strong {
            color: #5cff9d;
            font-size: 22px;
        }

        /* =========================
       FOOD POP EFFECT
    ========================= */

        .eat-effect {
            position: absolute;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            border: 3px solid #ff4d6d;

            pointer-events: none;

            animation: eatEffect 0.45s ease-out forwards;
        }

        @keyframes eatEffect {
            0% {
                transform: scale(0.4);
                opacity: 1;
            }

            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* =========================
       MOBILE CONTROLS
    ========================= */

        .mobile-controls {
            display: none;

            margin: 18px auto 0;

            width: 170px;

            grid-template-columns: repeat(3, 50px);

            grid-template-rows: repeat(2, 50px);

            gap: 8px;
        }

        .mobile-controls button {
            padding: 0;

            width: 50px;
            height: 50px;

            border-radius: 12px;

            background: #111a27;
            color: #5cff9d;

            border: 1px solid rgba(92, 255, 157, 0.25);

            box-shadow: none;

            font-size: 20px;
        }

        .mobile-controls button:active {
            background: #5cff9d;
            color: #06100a;
        }

        .up {
            grid-column: 2;
        }

        .left {
            grid-column: 1;
            grid-row: 2;
        }

        .down {
            grid-column: 2;
            grid-row: 2;
        }

        .right {
            grid-column: 3;
            grid-row: 2;
        }

        /* =========================
       RESPONSIVE
    ========================= */

        @media (max-width: 600px) {

            body {
                align-items: flex-start;
                padding-top: 25px;
            }

            .game-container {
                width: 94vw;
            }

            .mobile-controls {
                display: grid;
            }

            .instructions {
                display: none;
            }
        }
    </style>
</head>


<body>

    <main class="game-container">

        <h1 class="title">NEON SNAKE</h1>


        <!-- SCORE -->
        <div class="score-board">

            <div class="score-box">
                <span class="score-label">SCORE</span>
                <span id="score" class="score-value">0</span>
            </div>

            <div class="score-box">
                <span class="score-label">HIGH SCORE</span>
                <span id="highScore" class="score-value">0</span>
            </div>

        </div>


        <!-- BOARD -->
        <div class="board-wrapper">

            <canvas id="gameCanvas"></canvas>


            <!-- GAME OVER -->
            <div id="gameOver" class="game-over">

                <h2>GAME OVER</h2>

                <p class="final-score">
                    Final Score:
                    <strong id="finalScore">0</strong>
                </p>

                <button id="playAgain">
                    Play Again
                </button>

            </div>

        </div>


        <!-- START / RESTART -->
        <div class="controls">

            <button id="startButton">
                Start Game
            </button>

        </div>


        <!-- MOBILE CONTROLS -->
        <div class="mobile-controls">

            <button class="up" data-direction="up">
                ▲
            </button>

            <button class="left" data-direction="left">
                ◀
            </button>

            <button class="down" data-direction="down">
                ▼
            </button>

            <button class="right" data-direction="right">
                ▶
            </button>

        </div>


        <p class="instructions">
            <span>Arrow Keys</span> / <span>WASD</span> to move
            &nbsp; • &nbsp;
            Swipe on mobile
        </p>

    </main>


    <script>

        /* ==========================================
           CANVAS SETUP
        ========================================== */

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");


        const scoreElement =
            document.getElementById("score");

        const highScoreElement =
            document.getElementById("highScore");

        const startButton =
            document.getElementById("startButton");

        const gameOverScreen =
            document.getElementById("gameOver");

        const finalScoreElement =
            document.getElementById("finalScore");

        const playAgainButton =
            document.getElementById("playAgain");


        /* ==========================================
           GAME SETTINGS
        ========================================== */

        const GRID = 24;

        let cellSize;

        let snake;

        let food;

        let direction;

        let nextDirection;

        let score = 0;

        let highScore =
            Number(localStorage.getItem("neonSnakeHighScore")) || 0;

        let gameRunning = false;

        let gameTimer;

        let speed;

        let particles = [];

        let foodPulse = 0;


        highScoreElement.textContent =
            highScore;


        /* ==========================================
           RESIZE CANVAS
        ========================================== */

        function resizeCanvas() {

            const size =
                Math.min(
                    canvas.parentElement.clientWidth - 16,
                    620
                );

            const dpr =
                window.devicePixelRatio || 1;

            canvas.width =
                size * dpr;

            canvas.height =
                size * dpr;

            canvas.style.width =
                size + "px";

            canvas.style.height =
                size + "px";

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

            cellSize =
                size / GRID;

            draw();

        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* ==========================================
           START GAME
        ========================================== */

        function startGame() {

            clearTimeout(gameTimer);

            snake = [

                {
                    x: 12,
                    y: 12
                },

                {
                    x: 11,
                    y: 12
                },

                {
                    x: 10,
                    y: 12
                },

                {
                    x: 9,
                    y: 12
                }

            ];


            direction = {
                x: 1,
                y: 0
            };


            nextDirection = {
                x: 1,
                y: 0
            };


            score = 0;

            speed = 140;

            particles = [];

            foodPulse = 0;

            scoreElement.textContent = "0";

            gameRunning = true;

            gameOverScreen.classList.remove(
                "show"
            );

            startButton.textContent =
                "Restart Game";


            spawnFood();

            gameLoop();

        }


        /* ==========================================
           GAME LOOP
        ========================================== */

        function gameLoop() {

            if (!gameRunning) {
                return;
            }

            update();

            draw();

            gameTimer =
                setTimeout(
                    gameLoop,
                    speed
                );

        }


        /* ==========================================
           UPDATE GAME
        ========================================== */

        function update() {

            direction =
                nextDirection;


            const head =
                snake[0];


            const newHead = {

                x: head.x + direction.x,

                y: head.y + direction.y

            };


            /* ------------------------------
               WALL COLLISION
            ------------------------------ */

            if (
                newHead.x < 0 ||
                newHead.x >= GRID ||
                newHead.y < 0 ||
                newHead.y >= GRID
            ) {

                endGame();

                return;

            }


            /* ------------------------------
               SELF COLLISION
            ------------------------------ */

            const hitBody =
                snake.some(
                    segment =>
                        segment.x === newHead.x &&
                        segment.y === newHead.y
                );


            if (hitBody) {

                endGame();

                return;

            }


            snake.unshift(newHead);


            /* ------------------------------
               FOOD
            ------------------------------ */

            if (
                newHead.x === food.x &&
                newHead.y === food.y
            ) {

                eatFood();

            } else {

                snake.pop();

            }

        }


        /* ==========================================
           SPAWN FOOD
        ========================================== */

        function spawnFood() {

            let valid = false;

            while (!valid) {

                food = {

                    x:
                        Math.floor(
                            Math.random() * GRID
                        ),

                    y:
                        Math.floor(
                            Math.random() * GRID
                        )

                };


                valid =
                    !snake.some(
                        segment =>
                            segment.x === food.x &&
                            segment.y === food.y
                    );

            }

        }


        /* ==========================================
           EAT FOOD
        ========================================== */

        function eatFood() {

            score++;

            scoreElement.textContent =
                score;


            /* HIGH SCORE */

            if (score > highScore) {

                highScore = score;

                highScoreElement.textContent =
                    highScore;

                localStorage.setItem(
                    "neonSnakeHighScore",
                    highScore
                );

            }


            /* SPEED */

            speed =
                Math.max(
                    55,
                    140 - score * 4
                );


            createParticles();

            spawnFood();

        }


        /* ==========================================
           PARTICLES
        ========================================== */

        function createParticles() {

            const centerX =
                (food.x + 0.5) * cellSize;

            const centerY =
                (food.y + 0.5) * cellSize;


            for (
                let i = 0;
                i < 14;
                i++
            ) {

                particles.push({

                    x: centerX,

                    y: centerY,

                    vx:
                        (Math.random() - 0.5) * 6,

                    vy:
                        (Math.random() - 0.5) * 6,

                    life: 1,

                    size:
                        Math.random() * 4 + 2

                });

            }

        }


        /* ==========================================
           DRAW GAME
        ========================================== */

        function draw() {

            if (!cellSize) {
                return;
            }


            const width =
                canvas.clientWidth;

            const height =
                canvas.clientHeight;


            /* BACKGROUND */

            ctx.fillStyle =
                "#080d14";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            drawGrid();

            drawFood();

            drawSnake();

            drawParticles();

        }


        /* ==========================================
           GRID
        ========================================== */

        function drawGrid() {

            ctx.strokeStyle =
                "rgba(255,255,255,0.035)";

            ctx.lineWidth = 1;


            for (
                let i = 0;
                i <= GRID;
                i++
            ) {

                const position =
                    i * cellSize;


                ctx.beginPath();

                ctx.moveTo(
                    position,
                    0
                );

                ctx.lineTo(
                    position,
                    GRID * cellSize
                );

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    position
                );

                ctx.lineTo(
                    GRID * cellSize,
                    position
                );

                ctx.stroke();

            }

        }


        /* ==========================================
           DRAW FOOD
        ========================================== */

        function drawFood() {

            if (!food) {
                return;
            }


            foodPulse += 0.08;


            const centerX =
                (food.x + 0.5) * cellSize;

            const centerY =
                (food.y + 0.5) * cellSize;


            const pulse =
                Math.sin(foodPulse) * 2;


            /* GLOW */

            ctx.save();

            ctx.shadowColor =
                "#ff3d81";

            ctx.shadowBlur =
                20;


            ctx.fillStyle =
                "#ff3d81";


            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                cellSize * 0.30 + pulse,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* INNER */

            ctx.shadowBlur = 0;

            ctx.fillStyle =
                "#ff8db3";


            ctx.beginPath();

            ctx.arc(
                centerX - 2,
                centerY - 2,
                cellSize * 0.13,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* LEAF */

            ctx.fillStyle =
                "#5cff9d";

            ctx.beginPath();

            ctx.ellipse(
                centerX + cellSize * 0.13,
                centerY - cellSize * 0.27,
                cellSize * 0.10,
                cellSize * 0.05,
                -0.5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.restore();

        }


        /* ==========================================
           DRAW SNAKE
        ========================================== */

        function drawSnake() {

            snake.forEach(
                (segment, index) => {

                    const padding =
                        index === 0 ? 1 : 2;


                    const x =
                        segment.x * cellSize +
                        padding;

                    const y =
                        segment.y * cellSize +
                        padding;


                    const size =
                        cellSize -
                        padding * 2;


                    ctx.save();


                    /* GLOW */

                    ctx.shadowColor =
                        index === 0
                            ? "#a6ffcb"
                            : "#35ff8a";

                    ctx.shadowBlur =
                        index === 0
                            ? 18
                            : 10;


                    /* HEAD */

                    if (index === 0) {

                        ctx.fillStyle =
                            "#a6ffcb";

                    } else {

                        ctx.fillStyle =
                            "#35e87d";

                    }


                    roundRect(
                        ctx,
                        x,
                        y,
                        size,
                        size,
                        7
                    );

                    ctx.fill();


                    /* BODY HIGHLIGHT */

                    if (index > 0) {

                        ctx.shadowBlur = 0;

                        ctx.fillStyle =
                            "rgba(255,255,255,0.12)";

                        roundRect(
                            ctx,
                            x + size * 0.15,
                            y + size * 0.12,
                            size * 0.7,
                            size * 0.18,
                            4
                        );

                        ctx.fill();

                    }


                    /* EYES */

                    if (index === 0) {

                        drawEyes(
                            segment,
                            x,
                            y,
                            size
                        );

                    }


                    ctx.restore();

                }
            );

        }


        /* ==========================================
           SNAKE EYES
        ========================================== */

        function drawEyes(
            segment,
            x,
            y,
            size
        ) {

            ctx.fillStyle =
                "#06100a";


            let eyePositions;


            if (direction.x === 1) {

                eyePositions = [
                    [0.72, 0.30],
                    [0.72, 0.70]
                ];

            } else if (
                direction.x === -1
            ) {

                eyePositions = [
                    [0.28, 0.30],
                    [0.28, 0.70]
                ];

            } else if (
                direction.y === -1
            ) {

                eyePositions = [
                    [0.30, 0.28],
                    [0.70, 0.28]
                ];

            } else {

                eyePositions = [
                    [0.30, 0.72],
                    [0.70, 0.72]
                ];

            }


            eyePositions.forEach(
                ([px, py]) => {

                    ctx.beginPath();

                    ctx.arc(
                        x + size * px,
                        y + size * py,
                        size * 0.07,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                }
            );

        }


        /* ==========================================
           PARTICLE DRAWING
        ========================================== */

        function drawParticles() {

            particles.forEach(
                particle => {

                    particle.x +=
                        particle.vx;

                    particle.y +=
                        particle.vy;

                    particle.life -=
                        0.045;

                    ctx.globalAlpha =
                        Math.max(
                            0,
                            particle.life
                        );

                    ctx.fillStyle =
                        "#ff4d91";

                    ctx.beginPath();

                    ctx.arc(
                        particle.x,
                        particle.y,
                        particle.size,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                }
            );


            ctx.globalAlpha = 1;


            particles =
                particles.filter(
                    particle =>
                        particle.life > 0
                );

        }


        /* ==========================================
           ROUNDED RECTANGLE
        ========================================== */

        function roundRect(
            context,
            x,
            y,
            width,
            height,
            radius
        ) {

            context.beginPath();

            context.moveTo(
                x + radius,
                y
            );

            context.lineTo(
                x + width - radius,
                y
            );

            context.quadraticCurveTo(
                x + width,
                y,
                x + width,
                y + radius
            );

            context.lineTo(
                x + width,
                y + height - radius
            );

            context.quadraticCurveTo(
                x + width,
                y + height,
                x + width - radius,
                y + height
            );

            context.lineTo(
                x + radius,
                y + height
            );

            context.quadraticCurveTo(
                x,
                y + height,
                x,
                y + height - radius
            );

            context.lineTo(
                x,
                y + radius
            );

            context.quadraticCurveTo(
                x,
                y,
                x + radius,
                y
            );

            context.closePath();

        }


        /* ==========================================
           CHANGE DIRECTION
        ========================================== */

        function changeDirection(
            newDirection
        ) {

            if (!gameRunning) {
                return;
            }


            /*
              Prevent 180-degree turns.
            */

            if (
                newDirection.x === -direction.x &&
                newDirection.y === -direction.y
            ) {

                return;

            }


            nextDirection =
                newDirection;

        }


        /* ==========================================
           KEYBOARD CONTROLS
        ========================================== */

        document.addEventListener(
            "keydown",
            event => {

                const key =
                    event.key.toLowerCase();


                if (
                    [
                        "arrowup",
                        "arrowdown",
                        "arrowleft",
                        "arrowright",
                        "w",
                        "a",
                        "s",
                        "d"
                    ].includes(key)
                ) {

                    event.preventDefault();

                }


                if (
                    key === "arrowup" ||
                    key === "w"
                ) {

                    changeDirection({
                        x: 0,
                        y: -1
                    });

                }


                else if (
                    key === "arrowdown" ||
                    key === "s"
                ) {

                    changeDirection({
                        x: 0,
                        y: 1
                    });

                }


                else if (
                    key === "arrowleft" ||
                    key === "a"
                ) {

                    changeDirection({
                        x: -1,
                        y: 0
                    });

                }


                else if (
                    key === "arrowright" ||
                    key === "d"
                ) {

                    changeDirection({
                        x: 1,
                        y: 0
                    });

                }

            }
        );


        /* ==========================================
           MOBILE BUTTONS
        ========================================== */

        document
            .querySelectorAll(
                ".mobile-controls button"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const directionName =
                            button.dataset.direction;


                        if (
                            directionName === "up"
                        ) {

                            changeDirection({
                                x: 0,
                                y: -1
                            });

                        }


                        if (
                            directionName === "down"
                        ) {

                            changeDirection({
                                x: 0,
                                y: 1
                            });

                        }


                        if (
                            directionName === "left"
                        ) {

                            changeDirection({
                                x: -1,
                                y: 0
                            });

                        }


                        if (
                            directionName === "right"
                        ) {

                            changeDirection({
                                x: 1,
                                y: 0
                            });

                        }

                    }
                );

            });


        /* ==========================================
           SWIPE CONTROLS
        ========================================== */

        let touchStartX = 0;

        let touchStartY = 0;


        canvas.addEventListener(
            "touchstart",
            event => {

                const touch =
                    event.changedTouches[0];

                touchStartX =
                    touch.clientX;

                touchStartY =
                    touch.clientY;

            },
            {
                passive: true
            }
        );


        canvas.addEventListener(
            "touchend",
            event => {

                const touch =
                    event.changedTouches[0];

                const deltaX =
                    touch.clientX - touchStartX;

                const deltaY =
                    touch.clientY - touchStartY;


                const minimumSwipe =
                    25;


                if (
                    Math.abs(deltaX) <
                    minimumSwipe &&
                    Math.abs(deltaY) <
                    minimumSwipe
                ) {

                    return;

                }


                if (
                    Math.abs(deltaX) >
                    Math.abs(deltaY)
                ) {

                    if (deltaX > 0) {

                        changeDirection({
                            x: 1,
                            y: 0
                        });

                    } else {

                        changeDirection({
                            x: -1,
                            y: 0
                        });

                    }

                } else {

                    if (deltaY > 0) {

                        changeDirection({
                            x: 0,
                            y: 1
                        });

                    } else {

                        changeDirection({
                            x: 0,
                            y: -1
                        });

                    }

                }

            },
            {
                passive: true
            }
        );


        /* ==========================================
           GAME OVER
        ========================================== */

        function endGame() {

            gameRunning = false;

            clearTimeout(gameTimer);

            finalScoreElement.textContent =
                score;

            gameOverScreen.classList.add(
                "show"
            );

            startButton.textContent =
                "Start Game";

            draw();

        }


        /* ==========================================
           BUTTON EVENTS
        ========================================== */

        startButton.addEventListener(
            "click",
            startGame
        );


        playAgainButton.addEventListener(
            "click",
            startGame
        );


        /* ==========================================
    INITIAL GAME STATE
 ========================================== */

        snake = [
            { x: 12, y: 12 },
            { x: 11, y: 12 },
            { x: 10, y: 12 },
            { x: 9, y: 12 }
        ];

        direction = {
            x: 1,
            y: 0
        };

        nextDirection = {
            x: 1,
            y: 0
        };

        speed = 140;

        spawnFood();

        resizeCanvas();

        snake = [
            { x: 12, y: 12 },
            { x: 11, y: 12 },
            { x: 10, y: 12 },
            { x: 9, y: 12 }
        ];

        direction = {
            x: 1,
            y: 0
        };

        nextDirection = {
            x: 1,
            y: 0
        };

        speed = 140;

        spawnFood();

        resizeCanvas();

        startGame();

    </script>
